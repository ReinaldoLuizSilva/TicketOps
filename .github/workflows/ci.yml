name: CI

env:
  PROJECT_ID: ticketops-63450
  REGION: us-central1
  SERVICE: ticketops
  REPO: ticketops

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: up Oracle
        run: |
          SENHA=$(openssl rand -hex 16)
          {
            echo "ORACLE_PASSWORD=$SENHA"
            echo "APP_USER_PASSWORD=$SENHA"
            echo "DB_USER=ticketops"
            echo "DB_PASSWORD=$SENHA"
            echo "DB_DSN=db:1521/FREEPDB1"
          } > .env
          docker compose up -d --wait --wait-timeout 600 db
      - run: pytest -q
      - name: Logs db Oracle
        if: failure()
        run: docker compose logs db

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ticketops:${{ github.sha }} .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy:
    needs: [lint, test, build, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/371390921224/locations/global/workloadIdentityPools/github/providers/ticketops
          service_account: ticketops-deploy@ticketops-63450.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build e push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        run: gcloud run deploy ${{ env.SERVICE }} --image "$IMAGE" --region ${{ env.REGION }} --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
                  --region ${{ env.REGION }} --format='value(status.url)')
          for _ in $(seq 1 10); do
            CORPO=$(curl -fsS "$URL/health") && break || sleep 5
          done
          echo "$CORPO" | grep -q '"service":"ticketops"' \
            || { echo "resposta inesperada: $CORPO"; exit 1; }