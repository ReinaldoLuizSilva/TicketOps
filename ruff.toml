target-version = "py312"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[lint.flake8-bugbear]
# Depends()/Query() em default de argumento é o padrão do FastAPI, não um bug
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]